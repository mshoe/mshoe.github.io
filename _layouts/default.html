<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Michael Xu</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ page.description | default: site.description | default: 'Michael Xu' }}">

    <!-- syntax highlighting CSS -->
    <link rel="stylesheet" href="{{ '/assets/syntax.css' | relative_url }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="{{ '/assets/responsive.css' | relative_url }}">

    <!-- Google Fonts -->
    <link href="{{ '/assets/css.css' | relative_url }}" rel="stylesheet" type="text/css">
  </head>

  <body>
    <!-- Navigation Bar -->
    <header id="nav">
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="{{ '/index.html' | relative_url }}">Home</a>
        <a href="{{ '/CV.pdf' | relative_url }}">CV</a>
        <a href="{{ '/guitar/index.html' | relative_url }}">Guitar</a>
        <a href="{{ '/blog/index.html' | relative_url }}">Blog</a>
        <a href="{{ '/misc/index.html' | relative_url }}">Misc</a>
      </nav>
      <nav class="nav-socials" aria-label="Social links">
        <a href="https://www.linkedin.com/in/mxucg/" aria-label="LinkedIn">
          <img src="{{ '/assets/images/contact/linkedin_circle_blue.jpg' | relative_url }}" alt="">
        </a>
        <a href="https://github.com/mshoe" aria-label="GitHub">
          <img src="{{ '/assets/images/contact/github_logo.png' | relative_url }}" alt="">
        </a>
        <a href="https://www.youtube.com/channel/UC4qfNTQgecwtluc0M5HRnTw" aria-label="YouTube">
          <img src="{{ '/assets/images/contact/youtube.png' | relative_url }}" alt="">
        </a>
        <a href="https://twitter.com/mxu_cg" aria-label="X / Twitter">
          <img src="{{ '/assets/images/contact/twitter_circle_blue.png' | relative_url }}" alt="">
        </a>
      </nav>
    </header>

    {% if page.disable_content_wrapper %}
      {{ content }}
    {% else %}
      <div class="site">
        <div class="content" id="home">
          {{ content }}
        </div>
      </div>
    {% endif %}

    {% for script in page.extra_scripts %}
      <script src="{{ script | relative_url }}" type="text/javascript"></script>
    {% endfor %}
    <script src="{{ '/assets/responsive.js' | relative_url }}" type="text/javascript"></script>
  </body>
</html>
